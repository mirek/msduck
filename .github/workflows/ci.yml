name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  fast:
    name: Deterministic crates
    if: >-
      github.actor_id == '8561' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.user.id == 8561 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.95.0-fast-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-rust-1.95.0-fast-${{ hashFiles('Cargo.lock') }}-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node --test tests/agent-work.test.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy -p msduck-core -p msduck-sql -p msduck-tds --all-targets --locked -- -D warnings
      - run: cargo test -p msduck-core -p msduck-sql -p msduck-tds --locked

  full:
    name: Workspace and clients
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.95.0-full-${{ hashFiles('Cargo.lock', 'vendor/**') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-rust-1.95.0-full-${{ hashFiles('Cargo.lock', 'vendor/**') }}-
      - run: npm ci --no-audit --no-fund
      - name: Record revision
        run: |
          mkdir -p artifacts/ci
          git rev-parse HEAD > artifacts/ci/revision.txt
          rustc --version > artifacts/ci/toolchain.txt
          node --version >> artifacts/ci/toolchain.txt
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee artifacts/ci/clippy.log
      - name: Rust workspace tests
        run: cargo test --workspace --locked 2>&1 | tee artifacts/ci/rust.log
      - name: Independent client tests
        run: npm test 2>&1 | tee artifacts/ci/clients.log
      - name: Diagnostic compatibility capture
        run: npm run audit:local 2>&1 | tee artifacts/ci/audit.log
      - name: Preserve logs and raw captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci/
            artifacts/compatibility/
          retention-days: 14
          if-no-files-found: warn
      - name: Explain verification scope
        if: always()
        run: |
          echo 'Rust and independent client tests check implemented behavior.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The diagnostic audit preserves known gaps; successful capture is not SQL Server equivalence.' >> "$GITHUB_STEP_SUMMARY"
