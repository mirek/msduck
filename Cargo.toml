[workspace]
members = [".", "crates/msduck-core", "crates/msduck-tds", "crates/msduck-sql"]
default-members = [".", "crates/msduck-core", "crates/msduck-tds", "crates/msduck-sql"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
sqlparser = { version = "0.63.0", features = ["visitor"] }

[package]
name = "msduck"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
msduck-core = { path = "crates/msduck-core" }
msduck-sql = { path = "crates/msduck-sql" }
msduck-tds = { path = "crates/msduck-tds" }
serde_json = "1.0.151"
uuid = "1.26.1"
ring = "0.17.14"
base64 = "0.22.1"
zeroize = { version = "1.9.0", features = ["std"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
duckdb = { version = "1.10505.0", features = ["bundled", "vscalar", "appender-arrow"] }
sqlparser.workspace = true

[dev-dependencies]
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
tokio-util = { version = "0.7.19", features = ["compat"] }

# DuckDB's native debug archive is very large; keep local builds lightweight.
[profile.dev]
debug = 0

[profile.test]
debug = 0

[patch.crates-io]
duckdb = { path = "vendor/duckdb" }
libduckdb-sys = { path = "vendor/libduckdb-sys" }
